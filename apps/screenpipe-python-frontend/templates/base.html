<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}screenpipe{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff; --fg: #000; --muted: #666; --dim: #999; --faint: #ccc;
      --border: #ccc; --border-active: #000;
      --font-h: 'Space Grotesk', system-ui, sans-serif;
      --font-b: 'Crimson Text', Baskerville, serif;
      --font-m: 'IBM Plex Mono', 'Courier New', monospace;
      --t: 150ms;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000; --fg: #fff; --muted: #999; --dim: #666; --faint: #222;
        --border: #333; --border-active: #fff;
      }
    }

    html, body { background: var(--bg); color: var(--fg); font-family: var(--font-b); font-size: 16px; line-height: 1.6; min-height: 100vh; }
    h1, h2, h3 { font-family: var(--font-h); font-weight: 500; letter-spacing: -0.02em; text-transform: lowercase; }
    code, .mono { font-family: var(--font-m); font-size: 13px; }
    a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { background: var(--fg); color: var(--bg); text-decoration: none; }

    /* layout */
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

    /* nav */
    nav { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
    nav .inner { display: flex; align-items: center; gap: 0; max-width: 1000px; margin: 0 auto; padding: 0 24px; }
    .wordmark { font-family: var(--font-h); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; color: var(--fg); padding: 14px 0; margin-right: 32px; white-space: nowrap; }
    .wordmark:hover { background: none; color: var(--muted); }
    .nav-links { display: flex; list-style: none; height: 100%; }
    .nav-links li a { display: block; font-family: var(--font-h); font-size: 12px; font-weight: 400; text-decoration: none; color: var(--muted); text-transform: lowercase; padding: 16px 14px; border-bottom: 2px solid transparent; transition: color var(--t), border-color var(--t); }
    .nav-links li a:hover { color: var(--fg); background: none; border-bottom-color: var(--border); }
    .nav-links li a.active { color: var(--fg); border-bottom-color: var(--fg); }

    main { padding: 40px 0 80px; }

    /* buttons */
    .btn { font-family: var(--font-h); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 18px; border: 1px solid var(--fg); background: var(--bg); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all var(--t); border-radius: 0; line-height: 1; white-space: nowrap; }
    .btn:hover { background: var(--fg); color: var(--bg); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-ghost { border-color: var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--fg); background: var(--fg); color: var(--bg); }
    .btn-sm { font-size: 10px; padding: 5px 12px; }
    .btn-danger { border-color: var(--fg); }

    /* inputs */
    input[type="text"], input[type="search"], textarea, select {
      font-family: var(--font-m); font-size: 13px; padding: 0 12px;
      border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      border-radius: 0; outline: none; width: 100%; height: 40px;
      transition: border-color var(--t); -webkit-appearance: none; appearance: none;
    }
    textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 80px; }
    input:focus, textarea:focus, select:focus { border-color: var(--border-active); outline: 1px solid var(--border-active); outline-offset: 1px; }
    input::placeholder, textarea::placeholder { color: var(--dim); }

    /* page header */
    .ph { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .ph h1 { font-size: 24px; }
    .ph-sub { color: var(--muted); font-size: 14px; font-family: var(--font-h); }

    /* section */
    .section { margin-bottom: 40px; }
    .section-title { font-family: var(--font-h); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

    /* stat grid */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 32px; }
    .stat-card { background: var(--bg); padding: 20px; }
    .stat-label { font-family: var(--font-m); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
    .stat-value { font-family: var(--font-h); font-size: 28px; font-weight: 600; line-height: 1; }
    .stat-sub { font-family: var(--font-m); font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* status dot */
    .dot { display: inline-block; width: 6px; height: 6px; background: var(--dim); vertical-align: middle; margin-right: 5px; }
    .dot.on { background: var(--fg); animation: pulse 1.6s infinite; }
    .dot.off { background: var(--dim); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.15} }

    /* rows */
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* cards */
    .card { border: 1px solid var(--border); padding: 20px; margin-bottom: 1px; }

    /* items */
    .item { border-bottom: 1px solid var(--border); padding: 14px 0; }
    .item:first-child { border-top: 1px solid var(--border); }
    .item-type { font-family: var(--font-m); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
    .item-text { font-family: var(--font-b); font-size: 15px; line-height: 1.5; word-break: break-word; }
    .item-meta { font-family: var(--font-m); font-size: 11px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 5px; }

    /* tag */
    .tag { font-family: var(--font-m); font-size: 10px; letter-spacing: 0.08em; border: 1px solid var(--border); padding: 2px 7px; display: inline-block; }

    /* forms */
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .form-row input, .form-row select { flex: 1; }
    label.field-label { display: block; font-family: var(--font-m); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }

    /* search form */
    .search-main { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-main input { flex: 1; }
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-bar select, .filter-bar input { width: 160px; }

    /* action feedback */
    .feedback { font-family: var(--font-m); font-size: 12px; padding: 10px 14px; border: 1px solid var(--border); }
    .feedback.ok { }
    .feedback.err { border-color: var(--fg); }

    /* loading */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request.htmx-indicator { display: inline; }
    .loading-text { font-family: var(--font-m); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }

    /* empty / error */
    .empty { padding: 48px 0; text-align: center; color: var(--muted); font-family: var(--font-h); font-size: 13px; text-transform: lowercase; }
    .err-box { border: 1px solid var(--fg); padding: 14px 18px; font-family: var(--font-m); font-size: 12px; }

    /* event card (timeline) */
    .event-card { border-bottom: 1px solid var(--border); padding: 11px 0; animation: slidein var(--t) ease; }
    .event-card:first-child { border-top: 1px solid var(--border); }
    @keyframes slidein { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .event-name { font-family: var(--font-m); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
    .event-text { font-family: var(--font-b); font-size: 15px; line-height: 1.4; word-break: break-word; }
    .event-meta { font-family: var(--font-m); font-size: 11px; color: var(--dim); margin-top: 3px; }

    /* live status bar */
    .live-bar { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-m); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }

    /* meetings */
    .meeting-item { border-bottom: 1px solid var(--border); padding: 14px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .meeting-item:first-child { border-top: 1px solid var(--border); }
    .meeting-active { }
    .meeting-title { font-family: var(--font-h); font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .meeting-meta { font-family: var(--font-m); font-size: 11px; color: var(--dim); }

    /* memory */
    .memory-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
    .memory-item:first-child { border-top: 1px solid var(--border); }
    .memory-content { font-family: var(--font-b); font-size: 16px; line-height: 1.5; margin-bottom: 6px; }
    .memory-meta { font-family: var(--font-m); font-size: 11px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }

    /* add form box */
    .add-box { border: 1px solid var(--border); padding: 20px; margin-bottom: 28px; }
    .add-box h3 { font-size: 13px; margin-bottom: 14px; }

    /* pipes */
    .pipe-item { border-bottom: 1px solid var(--border); padding: 12px 0; display: flex; align-items: center; justify-content: space-between; }
    .pipe-item:first-child { border-top: 1px solid var(--border); }
    .pipe-name { font-family: var(--font-h); font-size: 14px; }

    /* devices */
    .device-item { border-bottom: 1px solid var(--border); padding: 10px 0; display: flex; align-items: center; gap: 12px; }
    .device-item:first-child { border-top: 1px solid var(--border); }
    .device-name { font-family: var(--font-m); font-size: 13px; }
    .device-type { font-family: var(--font-m); font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }

    /* pagination */
    .pagination { padding: 24px 0 0; text-align: center; }

    /* 2-col layout */
    .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

    /* responsive */
    @media (max-width: 680px) {
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .cols-2 { grid-template-columns: 1fr; }
      .filter-bar { flex-direction: column; }
      .filter-bar select, .filter-bar input { width: 100%; }
      nav .inner { gap: 0; }
      .nav-links li a { padding: 16px 10px; font-size: 11px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <div class="inner">
      <a class="wordmark" href="/">screenpipe</a>
      <ul class="nav-links">
        <li><a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>dashboard</a></li>
        <li><a href="/capture" {% if request.url.path == '/capture' %}class="active"{% endif %}>capture</a></li>
        <li><a href="/search" {% if request.url.path == '/search' %}class="active"{% endif %}>search</a></li>
        <li><a href="/timeline" {% if request.url.path in ['/timeline','/live'] %}class="active"{% endif %}>timeline</a></li>
        <li><a href="/meetings" {% if request.url.path == '/meetings' %}class="active"{% endif %}>meetings</a></li>
        <li><a href="/memory" {% if request.url.path == '/memory' %}class="active"{% endif %}>memory</a></li>
      </ul>
    </div>
  </nav>
  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
